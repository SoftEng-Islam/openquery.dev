<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06222b"/>
      <stop offset="0.55" stop-color="#0d4a52"/>
      <stop offset="1" stop-color="#1b6b5a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0 0L8 5L0 10z" fill="#fbbf24"/>
    </marker>
    <marker id="arrS" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0 0L8 5L0 10z" fill="#f472b6"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- number line 0..10 -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3">
    <line x1="100" y1="640" x2="1500" y2="640"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3">
    <line x1="150" y1="625" x2="150" y2="655"/><line x1="290" y1="625" x2="290" y2="655"/>
    <line x1="430" y1="625" x2="430" y2="655"/><line x1="570" y1="625" x2="570" y2="655"/>
    <line x1="710" y1="625" x2="710" y2="655"/><line x1="850" y1="625" x2="850" y2="655"/>
    <line x1="990" y1="625" x2="990" y2="655"/><line x1="1130" y1="625" x2="1130" y2="655"/>
    <line x1="1270" y1="625" x2="1270" y2="655"/><line x1="1410" y1="625" x2="1410" y2="655"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="34" fill="#ffffff" fill-opacity="0.75" text-anchor="middle">
    <text x="150" y="705">0</text><text x="290" y="705">1</text><text x="430" y="705">2</text>
    <text x="570" y="705">3</text><text x="710" y="705">4</text><text x="850" y="705">5</text>
    <text x="990" y="705">6</text><text x="1130" y="705">7</text><text x="1270" y="705">8</text>
    <text x="1410" y="705">9</text>
  </g>

  <!-- addition jump: 3 + 4 = 7 (amber, above) -->
  <path d="M570 625 Q 640 520 710 625" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" marker-end="url(#arrA)"/>
  <path d="M710 625 Q 780 520 850 625" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" marker-end="url(#arrA)"/>
  <path d="M850 625 Q 920 520 990 625" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" marker-end="url(#arrA)"/>
  <path d="M990 625 Q 1060 520 1130 625" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" marker-end="url(#arrA)"/>
  <circle cx="570" cy="640" r="11" fill="#fbbf24"/>
  <circle cx="1130" cy="640" r="11" fill="#fbbf24"/>

  <!-- subtraction jump: 9 - 3 = 6 (pink, below) -->
  <path d="M1410 655 Q 1340 760 1270 655" fill="none" stroke="#f472b6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrS)"/>
  <path d="M1270 655 Q 1200 760 1130 655" fill="none" stroke="#f472b6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrS)"/>
  <path d="M1130 655 Q 1060 760 990 655" fill="none" stroke="#f472b6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrS)"/>

  <!-- big plus and minus -->
  <g stroke-linecap="round">
    <g stroke="#fbbf24" stroke-opacity="0.9" stroke-width="22">
      <line x1="1230" y1="190" x2="1430" y2="190"/><line x1="1330" y1="90" x2="1330" y2="290"/>
    </g>
    <line x1="1230" y1="430" x2="1430" y2="430" stroke="#f472b6" stroke-opacity="0.9" stroke-width="22"/>
  </g>

  <!-- counters: 3 + 2 -->
  <g fill="#fbbf24" fill-opacity="0.85">
    <circle cx="820" cy="150" r="30"/><circle cx="900" cy="150" r="30"/><circle cx="980" cy="150" r="30"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.85">
    <circle cx="820" cy="240" r="30"/><circle cx="900" cy="240" r="30"/>
  </g>
  <g fill="none" stroke="#f472b6" stroke-width="4" stroke-dasharray="8 8" stroke-opacity="0.8">
    <circle cx="980" cy="240" r="30"/><circle cx="1060" cy="240" r="30"/>
  </g>

  <!-- ten frame -->
  <g transform="translate(790 330)" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3">
    <rect width="400" height="160"/>
    <line x1="80" y1="0" x2="80" y2="160"/><line x1="160" y1="0" x2="160" y2="160"/>
    <line x1="240" y1="0" x2="240" y2="160"/><line x1="320" y1="0" x2="320" y2="160"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <g fill="#fbbf24" fill-opacity="0.85" stroke="none">
      <circle cx="40" cy="40" r="26"/><circle cx="120" cy="40" r="26"/><circle cx="200" cy="40" r="26"/>
      <circle cx="280" cy="40" r="26"/><circle cx="360" cy="40" r="26"/>
      <circle cx="40" cy="120" r="26"/><circle cx="120" cy="120" r="26"/>
    </g>
  </g>

  <!-- equations (left side calm area kept light) -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="70" y="140" font-size="96" fill-opacity="0.12">3 + 4 = 7</text>
    <text x="70" y="270" font-size="96" fill-opacity="0.12">9 − 3 = 6</text>
    <text x="70" y="400" font-size="96" fill-opacity="0.10">5 + 2 = 7</text>
    <text x="70" y="530" font-size="96" fill-opacity="0.10">8 − 5 = 3</text>
    <text x="1000" y="860" font-size="80" fill-opacity="0.12">+  −  =</text>
    <text x="120" y="840" font-size="60" fill-opacity="0.12" font-style="italic">a + b = b + a</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
