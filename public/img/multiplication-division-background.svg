<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#220a1f"/>
      <stop offset="0.55" stop-color="#5a1a3a"/>
      <stop offset="1" stop-color="#a1432a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto">
      <path d="M0 0L8 5L0 10z" fill="#a3e635"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <!-- array: 3 rows x 4 columns = 12 -->
  <g transform="translate(790 80)">
    <rect width="320" height="240" rx="16" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3"/>
    <g fill="#fbbf24" fill-opacity="0.9">
      <circle cx="40" cy="40" r="26"/><circle cx="120" cy="40" r="26"/><circle cx="200" cy="40" r="26"/><circle cx="280" cy="40" r="26"/>
      <circle cx="40" cy="120" r="26"/><circle cx="120" cy="120" r="26"/><circle cx="200" cy="120" r="26"/><circle cx="280" cy="120" r="26"/>
      <circle cx="40" cy="200" r="26"/><circle cx="120" cy="200" r="26"/><circle cx="200" cy="200" r="26"/><circle cx="280" cy="200" r="26"/>
    </g>
  </g>

  <!-- big multiplication sign -->
  <g stroke="#fb923c" stroke-width="22" stroke-linecap="round" stroke-opacity="0.95">
    <line x1="1230" y1="130" x2="1370" y2="270"/>
    <line x1="1370" y1="130" x2="1230" y2="270"/>
  </g>

  <!-- 3 equal groups of 4 -->
  <g fill="none" stroke="#a3e635" stroke-width="3.5" stroke-dasharray="9 9" stroke-opacity="0.85">
    <circle cx="850" cy="470" r="70"/><circle cx="1010" cy="470" r="70"/><circle cx="1170" cy="470" r="70"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.9">
    <circle cx="828" cy="448" r="14"/><circle cx="872" cy="448" r="14"/><circle cx="828" cy="492" r="14"/><circle cx="872" cy="492" r="14"/>
    <circle cx="988" cy="448" r="14"/><circle cx="1032" cy="448" r="14"/><circle cx="988" cy="492" r="14"/><circle cx="1032" cy="492" r="14"/>
    <circle cx="1148" cy="448" r="14"/><circle cx="1192" cy="448" r="14"/><circle cx="1148" cy="492" r="14"/><circle cx="1192" cy="492" r="14"/>
  </g>

  <!-- big division sign -->
  <g stroke-linecap="round">
    <line x1="1370" y1="470" x2="1510" y2="470" stroke="#a3e635" stroke-width="22" stroke-opacity="0.95"/>
  </g>
  <g fill="#a3e635" fill-opacity="0.95">
    <circle cx="1440" cy="412" r="14"/><circle cx="1440" cy="528" r="14"/>
  </g>

  <!-- skip counting number line: 0..12, jumps of 3 -->
  <line x1="100" y1="720" x2="1500" y2="720" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="3">
    <line x1="150" y1="705" x2="150" y2="735"/><line x1="250" y1="710" x2="250" y2="730"/><line x1="350" y1="710" x2="350" y2="730"/>
    <line x1="450" y1="705" x2="450" y2="735"/><line x1="550" y1="710" x2="550" y2="730"/><line x1="650" y1="710" x2="650" y2="730"/>
    <line x1="750" y1="705" x2="750" y2="735"/><line x1="850" y1="710" x2="850" y2="730"/><line x1="950" y1="710" x2="950" y2="730"/>
    <line x1="1050" y1="705" x2="1050" y2="735"/><line x1="1150" y1="710" x2="1150" y2="730"/><line x1="1250" y1="710" x2="1250" y2="730"/>
    <line x1="1350" y1="705" x2="1350" y2="735"/>
  </g>
  <g fill="none" stroke="#a3e635" stroke-width="5" stroke-linecap="round">
    <path d="M150 705 Q 300 600 450 705" marker-end="url(#arr)"/>
    <path d="M450 705 Q 600 600 750 705" marker-end="url(#arr)"/>
    <path d="M750 705 Q 900 600 1050 705" marker-end="url(#arr)"/>
    <path d="M1050 705 Q 1200 600 1350 705" marker-end="url(#arr)"/>
  </g>
  <g fill="#a3e635">
    <circle cx="150" cy="720" r="11"/><circle cx="450" cy="720" r="11"/><circle cx="750" cy="720" r="11"/>
    <circle cx="1050" cy="720" r="11"/><circle cx="1350" cy="720" r="11"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="34" fill="#ffffff" fill-opacity="0.8" text-anchor="middle">
    <text x="150" y="785">0</text><text x="450" y="785">3</text><text x="750" y="785">6</text>
    <text x="1050" y="785">9</text><text x="1350" y="785">12</text>
  </g>
  <g font-family="'Courier New', monospace" font-size="28" fill="#ffffff" fill-opacity="0.3" text-anchor="middle">
    <text x="250" y="780">1</text><text x="350" y="780">2</text><text x="550" y="780">4</text><text x="650" y="780">5</text>
    <text x="850" y="780">7</text><text x="950" y="780">8</text><text x="1150" y="780">10</text><text x="1250" y="780">11</text>
  </g>

  <!-- faint equations -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="70" y="140" font-size="96" fill-opacity="0.12">3 × 4 = 12</text>
    <text x="70" y="270" font-size="96" fill-opacity="0.12">12 ÷ 3 = 4</text>
    <text x="70" y="400" font-size="96" fill-opacity="0.10">6 × 2 = 12</text>
    <text x="70" y="530" font-size="96" fill-opacity="0.10">12 ÷ 4 = 3</text>
    <text x="1030" y="880" font-size="70" fill-opacity="0.12" font-style="italic">a × b = b × a</text>
    <text x="70" y="620" font-size="60" fill-opacity="0.10">×  ÷  =</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
