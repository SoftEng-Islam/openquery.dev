<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#3a2a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.15" cy="0.9" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="grid2" width="250" height="250" patternUnits="userSpaceOnUse">
      <path d="M250 0H0V250" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#grid2)"/>

  <!-- axes -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="2">
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
  </g>

  <!-- sine wave -->
  <path d="M0 600 C 62 480, 188 480, 250 600 S 438 720, 500 600 S 688 480, 750 600 S 938 720, 1000 600 S 1188 480, 1250 600 S 1438 720, 1500 600 S 1600 540, 1600 540"
        fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- parabola -->
  <path d="M700 60 Q 1000 1000 1300 60" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- unit circle -->
  <g transform="translate(1000 600)">
    <circle r="150" fill="none" stroke="#a78bfa" stroke-width="3" stroke-opacity="0.9"/>
    <line x1="0" y1="0" x2="106" y2="-106" stroke="#f472b6" stroke-width="3"/>
    <circle cx="106" cy="-106" r="8" fill="#f472b6"/>
    <line x1="106" y1="-106" x2="106" y2="0" stroke="#ffffff" stroke-opacity="0.5" stroke-dasharray="6 6" stroke-width="2"/>
    <path d="M60 0 A60 60 0 0 0 42 -42" fill="none" stroke="#f472b6" stroke-width="2.5"/>
    <text x="68" y="-14" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#f9a8d4">θ</text>
  </g>

  <!-- floating math symbols -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#ffffff">
    <text x="1380" y="190" font-size="170" fill-opacity="0.16">π</text>
    <text x="1180" y="420" font-size="120" fill-opacity="0.14">∑</text>
    <text x="1460" y="470" font-size="140" fill-opacity="0.14">∫</text>
    <text x="1280" y="800" font-size="150" fill-opacity="0.12">√</text>
    <text x="760" y="170" font-size="130" fill-opacity="0.12">∞</text>
    <text x="80" y="150" font-size="110" fill-opacity="0.10" font-style="italic">x²</text>
    <text x="520" y="840" font-size="100" fill-opacity="0.10" font-style="italic">e<tspan font-size="60" dy="-40">iπ</tspan><tspan dy="40"> + 1 = 0</tspan></text>
    <text x="80" y="800" font-size="90" fill-opacity="0.10">+ − × ÷</text>
    <text x="640" y="330" font-size="70" fill-opacity="0.10" font-style="italic">a² + b² = c²</text>
    <text x="1130" y="110" font-size="60" fill-opacity="0.12" font-style="italic">f(x)</text>
    <text x="900" y="880" font-size="60" fill-opacity="0.10">Δ  ≈  ≠  ≤  ≥</text>
  </g>

  <!-- numbers scattered -->
  <g font-family="'Courier New', monospace" fill="#22d3ee" fill-opacity="0.22" font-size="34">
    <text x="60" y="360">1 2 3 5 8 13 21</text>
    <text x="90" y="420">3.14159265</text>
    <text x="60" y="480">0 1 1 2 3 5 8</text>
  </g>

  <!-- geometry: triangle + dots -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2.5">
    <polygon points="180,700 420,700 180,540"/>
    <rect x="180" y="680" width="20" height="20"/>
  </g>
  <g fill="#f59e0b" fill-opacity="0.8">
    <circle cx="180" cy="700" r="6"/><circle cx="420" cy="700" r="6"/><circle cx="180" cy="540" r="6"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
